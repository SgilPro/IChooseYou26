name: Deploy Live Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "app/**"
      - "data/**"
      - "assets/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Stage site (docs + app)
        run: |
          rm -rf _site
          cp -r docs-site _site
          mkdir -p _site/app
          cp -r app/dist/* _site/app/
          # 資料線產出（JSON/CSV）一起上站，讓 teams.html 直接讀
          mkdir -p _site/data/ref _site/data/channels
          cp data/ref/*.json _site/data/ref/
          for ch in data/channels/*/; do
            name=$(basename "$ch"); mkdir -p "_site/data/channels/$name"
            cp "$ch"/*.json "$ch"/*.csv "_site/data/channels/$name/" 2>/dev/null || true
          done
          # 靜態圖像素材（屬性色與圖示、道具圖示、寶可夢圖；pokemon/home 不上站，只上 art 與 thumb）
          mkdir -p _site/assets
          cp -r assets/types assets/items _site/assets/
          mkdir -p _site/assets/pokemon
          for d in art thumb; do [ -d "assets/pokemon/$d" ] && cp -r "assets/pokemon/$d" _site/assets/pokemon/ || true; done
          [ -f assets/pokemon/index.json ] && cp assets/pokemon/index.json _site/assets/pokemon/ || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
