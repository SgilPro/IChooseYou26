<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>比賽資訊｜I Choose You</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
    a { color: var(--accent-2); }
    h1 { font-size: 24px; } h2 { font-size: 19px; margin-top: 28px; }
    .note { color: var(--ink-soft); font-size: 13px; }
    .match { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin: 10px 0; }
    .round { font-weight: 700; color: var(--accent); }
    .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 8px; }
    .player { border-top: 1px dashed var(--border); padding-top: 8px; }
    .thumbs { display: flex; gap: 4px; margin-top: 6px; }
    .thumbs img { width: 44px; height: 44px; object-fit: contain; background: var(--tint); border-radius: 6px; }
    .src { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
    .tag { font-size: 11px; padding: 1px 8px; border-radius: 8px; border: 1px dotted var(--ink-soft); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" data-tip="寶可夢雙打學習天地">
      <img class="wordmark" src="assets/master-ball-wordmark-web.png" alt="I Choose You" width="800" height="163" />
      <div class="brand-sub">比賽資訊</div>
    </div>
    <div class="head-actions">
      <nav class="pill-nav" aria-label="主選單">
        <a href="./">文件</a>
        <a href="teams.html">隊伍列表</a>
        <a href="matches.html" aria-current="page">比賽資訊</a>
        <a href="roles.html">戰術定位</a>
        <a href="design-system.html">Design System</a>
        <a href="app/">試用工具</a>
      </nav>
    </div>
  </header>
<div class="wrap">
  <h1>比賽資訊（暫版）</h1>
  <p class="note">賽事 → 對戰（match）→ 選手隊伍。每個對戰有固定 id，之後抽官方 replay 影片時依同一個 match id 補資料，不重複建立。結構與介面之後再優化。</p>
  <div id="app">載入中…</div>
</div>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const j = async (p) => (await fetch(p, { cache: "no-cache" })).json();
  try {
    const idx = await j("data/events/index.json");
    const [teams, pidx] = await Promise.all([j("data/channels/fiskepokemon/teams.json"), j("assets/pokemon/index.json").catch(() => ({}))]);
    const byId = Object.fromEntries(teams.map((t) => [t.id, t]));
    const thumb = (m) => { const e = pidx[m.species?.name_en]; return e?.thumb ? "assets/pokemon/" + e.thumb : ""; };
    let html = "";
    for (const id of idx.events) {
      const ev = await j(`data/events/${id}.json`);
      html += `<h2>${esc(ev.name_zh)} <span class="note">${esc(ev.name_en)}</span></h2>`;
      for (const m of ev.matches) {
        html += `<div class="match"><span class="round">${esc(m.round)}</span>
          <div class="players">${m.players.map((p) => `<div class="player"><strong>${esc(p.name)}</strong>
            ${p.team_ids.map((tid) => { const t = byId[tid]; if (!t) return `<div class="note">${esc(tid)}（資料未載入）</div>`;
              return `<div><a href="team.html?id=${encodeURIComponent(tid)}">查看隊伍</a>${t.source_t_s != null ? ` · <a href="${esc(t.video_url)}" target="_blank" rel="noopener">影片 ${Math.floor(t.source_t_s / 60)}:${String(t.source_t_s % 60).padStart(2, "0")}</a>` : ""}</div>
              ${t.review_status === "members-only-withheld" ? `<div class="note">會員限定影片，配置不公開</div>` : `<div class="thumbs">${(t.members || []).map((x) => `<img loading="lazy" src="${thumb(x)}" alt="${esc(x.species?.name_zh)}" onerror="this.style.visibility='hidden'" />`).join("")}</div>`}`; }).join("")}
            ${p.team_ids.length === 0 ? `<div class="note">尚無隊伍資料</div>` : ""}</div>`).join("")}</div>
          <div class="src">來源：${m.sources.map((s) => esc(s.kind === "commentary" ? "Fiske 講比賽影片" : s.kind) + " " + esc(s.video_id)).join("、")}　<span class="tag">${esc(m.id)}</span></div></div>`;
      }
    }
    $("app").innerHTML = html || "<p class='note'>尚無賽事資料。</p>";
  } catch (e) { $("app").innerHTML = `<p class="note">載入失敗：${esc(e.message)}</p>`; }
})();
</script>
<script src="tooltip.js"></script>
<script src="components.js"></script>
<script src="site-header.js"></script>
</body>
</html>
